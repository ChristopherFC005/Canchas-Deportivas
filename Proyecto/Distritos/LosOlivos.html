<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canchas de Futbol - Los Olivos | Mi Cancha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="css/distrito.css">

<body class="reservation-page">

  <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-trophy-fill me-2"></i>Mi Cancha
      </a>
      <a class="btn btn-outline-light btn-sm" href="../ReservaAqui/reserva.html">
        <i class="bi bi-arrow-left me-1"></i>Cambiar distrito
      </a>
    </div>
  </nav>

  <header class="section-pad bg-light">
    <div class="container">
      <span class="badge text-bg-success mb-2"><i class="bi bi-dribbble me-1"></i>Futbol</span>
      <h1 class="fw-bold mb-2">Canchas en <span class="text-success" id="nombreDistrito"></span></h1>
      <p class="text-secondary mb-4">Revisa la disponibilidad de horarios y elige la cancha que mejor te quede.</p>

      <div class="row g-3">
        <div class="col-sm-6 col-md-4">
          <div class="info-tile h-100">
            <i class="bi bi-geo-alt-fill"></i>
            <strong id="statCanchas">0</strong>
            <span>Canchas encontradas</span>
          </div>
        </div>
        <div class="col-sm-6 col-md-4">
          <div class="info-tile h-100">
            <i class="bi bi-calendar2-check"></i>
            <strong id="statDisponibles">0</strong>
            <span>Horarios libres</span>
          </div>
        </div>
      </div>
    </div>

  <main class="section-pad bg-white">
    <div class="container">
      <div id="listaResultados" class="d-flex flex-column gap-4"></div>
    </div>
  </main>

  <footer class="footer-section">
    <div class="container text-center">
      <p class="small mb-0">&copy; 2026 Mi Cancha. Todos los derechos reservados.</p>
    </div>
